# 网站的同步、构建和部署（GitHub Pages）。
#
# 三个任务接力：
#   sync    只在每天定时和手动运行时跑：读小宇宙节目页和 GitHub 的最新版本，写回 data/，测试通过就提交有变化的数据。
#           两个同步各管各的，一个失败不拖住另一个；有失败的话，这个任务最后标红，整次运行也就是红的。
#   build   构建网站（连同各作品的源码包）并上传。每次运行都构建（推送、每天定时、手动都一样），
#           sync 失败时用仓库里已有的数据。
#   deploy  部署到 GitHub Pages。每天都重新部署一次，哪天部署失败了，第二天自动恢复。
# 推送到 main（改内容、发博客）不跑 sync，直接构建、部署。
#
# 仓库是公开的，Actions 日志谁都能看：同步脚本只打印期数、编号、版本号和错误码。
# 不要在这里加会打印页面内容的命令（git diff、cat data/*.json 之类）。
name: site

on:
  push:
    branches: [main]
  schedule:
    # 东八区每天 06:17（UTC 22:17）。不排整点：整点是 GitHub 的高峰，定时任务会延迟，甚至被丢掉。
    - cron: '17 22 * * *'
  workflow_dispatch:

# sync 要推送提交（contents: write）；deploy 要部署 Pages（pages: write、id-token: write）。
permissions:
  contents: write
  pages: write
  id-token: write

# 同一时间最多一个在跑、一个在等：正在跑的不取消（cancel-in-progress: false）；已经有一个在等时又来一个，
# 先前在等的那个被取消，只留最新的（默认的 queue: single）。在等的定时运行要是被推送顶掉，当天就不同步，第二天照常。
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  sync:
    # push 不需要同步，跳过。
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # 取 main 最新。定时运行默认拿触发那一刻的提交，排队期间 main 可能已经前进，
          # 在旧提交上提交就推不上去。
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      # 两个同步各自允许失败：失败的那个不写文件，另一个照常；最后一步再让这个任务标红。
      - name: 同步小宇宙节目页
        id: podcast
        continue-on-error: true
        run: node scripts/sync-podcast.mjs
      - name: 同步 GitHub 版本
        id: releases
        continue-on-error: true
        run: node scripts/sync-releases.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
      # 同步脚本只在数据真有变化时才改文件，所以没变化就什么都不提交（不做保活的空提交）。
      - name: 有改动就提交
        run: |
          git add -- data
          if git diff --cached --quiet; then
            echo "数据没有变化，不提交"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "同步：$(TZ=Asia/Shanghai date +%F)"
            git push origin HEAD:main
          fi
      # continue-on-error 的步骤失败了，outcome 仍是 failure（conclusion 才被改成 success）。
      - name: 有同步失败就让这个任务标红
        if: ${{ steps.podcast.outcome == 'failure' || steps.releases.outcome == 'failure' }}
        env:
          PODCAST: ${{ steps.podcast.outcome }}
          RELEASES: ${{ steps.releases.outcome }}
        run: |
          echo "节目页同步：$PODCAST；版本同步：$RELEASES"
          exit 1

  build:
    needs: sync
    # push 时 sync 是 skipped，sync 失败时它是 failure。不写 if 时默认的条件要求上游任务都成功，
    # build 就会被连带跳过。!cancelled() 是：只要这次运行没被取消就构建，sync 被跳过或失败都照常用仓库里已有的数据。
    # 这个 if 只管 build 自己：默认条件看的是整条上游链，连 sync 也算在内，所以 deploy 也要写自己的 if（见下面）。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # 取 main 最新：sync 刚推送过提交，而用 GITHUB_TOKEN 推送的提交不会再触发新的运行，
          # 所以同步之后要在这个运行里接着构建。构建不需要推送，也就不在仓库里留下令牌。
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      # 构建时从 GitHub 取各作品的源码包放进 downloads/（zip 不进仓库）。取不到的跳过：打印一行错误码，
      # 那件作品页上不放下载按钮，构建照常完成。
      # 页面里 generator 标记的版本取实际构建的提交：触发这次运行的是 sync 之前的提交，
      # sync 刚推送的提交它不认识，所以在这里用 HEAD 覆盖。
      - name: 构建
        run: GITHUB_SHA="$(git rev-parse HEAD)" node build.mjs --out dist --with-downloads
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    # 只看 build：没被取消、build 成功就部署。不写的话，sync 被跳过（push）或失败时 deploy 会被连带跳过。
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
